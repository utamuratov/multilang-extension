<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <title>MultiLang Extension - Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }

    h2 { color: #333; margin-bottom: 6px; }
    p { color: #666; font-size: 14px; margin-bottom: 24px; }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 5px;
    }

    input[data-translate], textarea[data-translate] {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: white;
    }

    input[data-translate]:focus, textarea[data-translate]:focus {
      border-color: #7c6af7;
    }

    .hint {
      font-size: 12px;
      color: #aaa;
      margin-top: 24px;
      padding: 12px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #eee;
    }
  </style>
</head>
<body>
  <h2>🌐 MultiLang Extension - Test Sahifasi</h2>
  <p>Bitta inputga yozing, blur qiling (Tab yoki tashqariga bosing) — qolganlar avtomatik to'ladi.</p>

  <div class="form-group">
    <label>🇺🇿 O'zbek</label>
    <input type="text" data-translate="uz" placeholder="O'zbekcha matn yozing..." />
  </div>

  <div class="form-group">
    <label>🇬🇧 English</label>
    <input type="text" data-translate="en" placeholder="Type in English..." />
  </div>

  <div class="form-group">
    <label>🇷🇺 Русский</label>
    <input type="text" data-translate="ru" placeholder="Введите текст..." />
  </div>

  <div class="form-group">
    <label>🏴 Qaraqalpaq</label>
    <input type="text" data-translate="kk" placeholder="Qaraqalpaqsha jazıw..." />
  </div>

  <div class="hint">
    💡 <strong>Eslatma:</strong> Extension yoqilgan va API key kiritilgan bo'lishi kerak.
    Textarea ham ishlaydi — <code>data-translate</code> attributi qo'yilsa kifoya.
  </div>
</body>
</html>
