<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>MultiLang Extension - Test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f5f5f5;
      }

      h2 {
        color: #333;
        margin-bottom: 6px;
      }
      p {
        color: #666;
        font-size: 14px;
        margin-bottom: 24px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #888;
        margin-bottom: 5px;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
        background: white;
        box-sizing: border-box;
      }

      input[data-translate]:focus,
      textarea[data-translate]:focus {
        border-color: #7c6af7;
      }

      .hint {
        font-size: 12px;
        color: #aaa;
        margin-top: 24px;
        padding: 12px;
        background: #fff;
        border-radius: 8px;
        border: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <h2>🌐 MultiLang Extension - Test Page</h2>
    <p>
      Type in any input, then press the button — the other inputs will be filled
      automatically.
    </p>

    <div class="form-group">
      <label for="en">🇬🇧 English</label>
      <input
        type="text"
        id="en"
        placeholder="Type in English..."
        data-translate="en"
      />
    </div>

    <div class="form-group">
      <label for="ru">🇷🇺 Russian</label>
      <input
        type="text"
        id="ru"
        placeholder="Enter text..."
        data-translate="ru"
      />
    </div>

    <div class="form-group">
      <label for="de">🇩🇪 German</label>
      <input
        type="text"
        id="de"
        placeholder="Write in German..."
        data-translate="de"
      />
    </div>

    <div class="hint">
      💡 <strong>Note:</strong> When the extension is enabled, it is enough to
      add the appropriate language code to the
      <code>data-translate</code> attribute of <code>input</code> or
      <code>textarea</code>.
    </div>
  </body>
</html>
